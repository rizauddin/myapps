<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Luluske social preview artwork</title>
  <style>
    * { box-sizing: border-box; }
    body { width: 1200px; height: 630px; margin: 0; background: #f8fafc; color: #131b2e; font-family: Arial, sans-serif; }
    main { height: 100%; padding: 56px 64px; border-top: 12px solid #1e40af; }
    header { display: flex; justify-content: space-between; align-items: center; }
    .brand { font-size: 48px; font-weight: 700; letter-spacing: -2px; color: #00288e; }
    .brand span { color: #2563eb; }
    .category { font-size: 20px; color: #475569; }
    .content { display: flex; gap: 48px; align-items: center; margin-top: 54px; }
    .intro { flex: 1; }
    h1 { margin: 0 0 24px; font-size: 64px; line-height: 1.1; letter-spacing: -2px; }
    p { margin: 0; font-size: 25px; line-height: 1.5; color: #475569; }
    .card { width: 330px; padding: 30px; background: #fff; border: 1px solid #e2e8f0; border-radius: 20px; }
    .card h2 { margin: 0 0 24px; font-size: 21px; color: #00288e; }
    .card div { padding: 16px 0; border-top: 1px solid #e2e8f0; font-size: 21px; }
    .card b { display: inline-block; width: 32px; color: #047857; }
    footer { margin-top: 42px; font-size: 20px; color: #00288e; }
  </style>
</head>
<body>
  <main>
    <header><div class="brand">luluske<span>?</span></div><div class="category">University course grade calculator</div></header>
    <div class="content">
      <div class="intro"><h1>Course grades,<br>made clear.</h1><p>Check your grade and pass requirements.<br>Plan your final exam score.</p></div>
      <section class="card"><h2>Your course, at a glance</h2><div><b>✓</b> Carry marks</div><div><b>✓</b> Final exam targets</div><div><b>✓</b> Grade &amp; pass/fail</div></section>
    </div>
    <footer>app.rizauddin.com/luluske</footer>
  </main>
</body>
</html>
